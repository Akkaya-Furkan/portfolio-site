name: Pages (disabled)
# Deliberately inert: no push trigger and a hard-false job gate.
# Publishing requires a separately authorized edit and Pages configuration.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    if: ${{ false }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment

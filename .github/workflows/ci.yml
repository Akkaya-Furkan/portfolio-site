name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python scripts/build.py
      - run: python -m pytest -q --junitxml=artifacts/pytest.xml
      - run: git diff --exit-code -- site
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validated-site-and-tests
          path: |
            site/
            artifacts/pytest.xml
